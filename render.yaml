services:
  - type: web
    name: first-bloom
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: first-bloom-db
          property: connectionString

databases:
  - name: first-bloom-db
    plan: free
    region: singapore
    databaseName: firstbloom
    user: firstbloom_user
